<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straight Wire Electric | Hub</title>
    <script src="assets/js/company-branding-bootstrap.js?v=20260310a"></script>
    <link rel="stylesheet" href="assets/css/portal-hub.css?v=20260310b">
</head>

<body class="hub-shell font-sans text-white min-h-screen flex flex-col items-center justify-center p-6 relative">

    <div class="overlay"></div>

    <!-- Main Content -->
    <div class="w-full max-w-5xl z-10 flex flex-col items-center">

        <!-- Header with Logo -->
        <div class="text-center mb-16 animate-float">
            <img src="assets/images/logo.webp" alt="Straight Wire Electric"
                class="w-44 sm:w-56 md:w-72 lg:w-80 h-auto mx-auto mb-6 drop-shadow-2xl object-contain" decoding="async" fetchpriority="high">
            <h1 class="text-4xl md:text-6xl font-black uppercase tracking-widest mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600"
                style="text-shadow: 0 10px 30px rgba(0,0,0,0.5);" data-company-display-name>
                Straight Wire Electric
            </h1>
            <p class="text-gray-400 text-lg md:text-xl tracking-[0.2em] font-light" data-company-tagline>Service Portal</p>
        </div>

        <!-- Role Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl">

            <!-- CLIENTE -->
            <a href="login-gateway.html"
                class="role-card card-client group p-8 rounded-3xl flex flex-col items-center text-center cursor-pointer animate-slide-up"
                data-company-role-card="client"
                style="animation-delay: 0.1s;">
                <div class="role-visual">
                    <div class="role-icon" data-company-role-icon="client">&#9889;</div>
                    <img class="role-image hidden" data-company-role-image="client" alt="Cliente">
                </div>
                <h3
                    class="text-2xl font-black uppercase mb-2 tracking-wider group-hover:text-yellow-400 transition-colors"
                    data-company-role-title="client">
                    Cliente</h3>
                <p class="text-gray-400 text-sm leading-relaxed group-hover:text-gray-200 transition-colors"
                    data-company-role-description="client">
                    Solicitar servicios, ver presupuestos y realizar pagos.
                </p>
                <div
                    data-company-role-cta="client"
                    class="mt-6 px-6 py-2 rounded-full border border-white/10 text-xs font-bold uppercase tracking-widest bg-black/20 group-hover:bg-yellow-500/20 group-hover:border-yellow-500/50 group-hover:text-yellow-400 transition-all">
                    Acceder &rarr;
                </div>
            </a>

            <!-- EMPLEADO -->
            <a href="login-empleado.html"
                class="role-card card-employee group p-8 rounded-3xl flex flex-col items-center text-center cursor-pointer animate-slide-up"
                data-company-role-card="employee"
                style="animation-delay: 0.2s;">
                <div class="role-visual">
                    <div class="role-icon" data-company-role-icon="employee">&#128736;</div>
                    <img class="role-image hidden" data-company-role-image="employee" alt="Empleado">
                </div>
                <h3
                    class="text-2xl font-black uppercase mb-2 tracking-wider group-hover:text-green-500 transition-colors"
                    data-company-role-title="employee">
                    Empleado</h3>
                <p class="text-gray-400 text-sm leading-relaxed group-hover:text-gray-200 transition-colors"
                    data-company-role-description="employee">
                    Gestion de trabajos, actualizaciones y reportes.
                </p>
                <div
                    data-company-role-cta="employee"
                    class="mt-6 px-6 py-2 rounded-full border border-white/10 text-xs font-bold uppercase tracking-widest bg-black/20 group-hover:bg-green-500/20 group-hover:border-green-500/50 group-hover:text-green-400 transition-all">
                    Ingresar &rarr;
                </div>
            </a>

            <!-- JEFE -->
            <a href="login-jefe.html"
                class="role-card card-boss group p-8 rounded-3xl flex flex-col items-center text-center cursor-pointer animate-slide-up"
                data-company-role-card="boss"
                style="animation-delay: 0.3s;">
                <div class="role-visual">
                    <div class="role-icon" data-company-role-icon="boss">&#128737;</div>
                    <img class="role-image hidden" data-company-role-image="boss" alt="Jefe">
                </div>
                <h3
                    class="text-2xl font-black uppercase mb-2 tracking-wider group-hover:text-purple-500 transition-colors"
                    data-company-role-title="boss">
                    Admin</h3>
                <p class="text-gray-400 text-sm leading-relaxed group-hover:text-gray-200 transition-colors"
                    data-company-role-description="boss">
                    Auditoria, control de calidad y finanzas.
                </p>
                <div
                    data-company-role-cta="boss"
                    class="mt-6 px-6 py-2 rounded-full border border-white/10 text-xs font-bold uppercase tracking-widest bg-black/20 group-hover:bg-purple-500/20 group-hover:border-purple-500/50 group-hover:text-purple-400 transition-all">
                    Panel Jefe &rarr;
                </div>
            </a>

        </div>

        <!-- Footer -->
        <div class="mt-16 text-center text-white/20 text-xs uppercase tracking-widest font-bold animate-slide-up"
            style="animation-delay: 0.5s;">
            &copy; 2024 <span data-company-legal-name>Straight Wire Electric LLC</span>
        </div>

    </div>

    <script type="module" src="assets/js/company-branding.js?v=20260228e"></script>

</body>

</html>
