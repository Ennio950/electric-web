<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirigiendo trabajo programado | Straight Wire Electric</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="emergency.html?mode=scheduled" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --panel: rgba(8, 15, 34, 0.92);
      --line: rgba(148, 163, 184, 0.2);
      --text: #e5f4ff;
      --muted: #9bb2c9;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 30%),
        linear-gradient(180deg, #020617 0%, var(--bg) 100%);
    }

    main {
      width: min(520px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 26px 60px rgba(2, 6, 23, 0.5);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    a {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Abriendo trabajo programado</h1>
    <p>Esta ruta ahora usa el mismo flujo operativo que emergencias, pero en modo programado.</p>
    <p style="margin-top:12px;">
      Si no redirige automaticamente, abre
      <a id="scheduleFallbackLink" href="emergency.html?mode=scheduled">emergency.html?mode=scheduled</a>.
    </p>
  </main>
  <script src="assets/js/schedule-redirect.js"></script>
</body>
</html>
