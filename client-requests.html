<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Requests | Straight Wire Electric</title>
  <script src="assets/js/company-branding-bootstrap.js?v=20260301b"></script>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/chat.css?v=20260213e" />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #22c55e;
      /* Green for Claimable */
      --accent-secondary: #6366f1;
      /* Indigo for Active */
      --accent-warning: #f59e0b;
      /* Amber for Payments */
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    body {
      background: var(--bg-gradient);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .main-viewport {
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      width: 100vw;
    }

    /* MASTER LIST (Left Panel) */
    .master-panel {
      background: rgba(0, 0, 0, 0.2);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .master-header {
      padding: 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .master-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .master-header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .tab-bar {
      display: flex;
      padding: 10px;
      gap: 4px;
      background: rgba(0, 0, 0, 0.1);
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 12px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .scroll-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* List Card Elite Design */
    .mini-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .mini-card:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateX(4px);
    }

    .mini-card.active {
      border-color: var(--accent-secondary);
      background: rgba(99, 102, 241, 0.08);
    }

    .mini-card .urgency-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .mini-card h3 {
      font-size: 0.9rem;
      margin: 0 0 6px 0;
      width: 70%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-card .meta-row {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .pay-mini {
      margin-top: 8px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.75);
    }

    .payments-summary {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .payments-summary-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .payments-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .payments-filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pay-filter-btn {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--text-dim);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pay-filter-btn.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    .payments-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .pay-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px;
    }

    .pay-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent-warning);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .pay-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 10px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.85);
    }

    .pay-row strong {
      color: #fff;
    }

    /* DETAIL VIEW (Right Panel) */
    .detail-panel {
      background: transparent;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .empty-state-detail {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      opacity: 0.3;
      text-align: center;
    }

    .detail-content {
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
      overflow-wrap: anywhere;
      word-break: break-word;
      flex: 1;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .detail-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .detail-header-pro {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-tracker-pro {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }

    .step-pip {
      height: 4px;
      flex: 1;
      background: var(--glass-border);
      border-radius: 2px;
    }

    .step-pip.filled {
      background: var(--accent-secondary);
    }

    .action-hero {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      margin-top: 30px;
    }

    .btn-hero {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: filter 0.2s;
    }

    .btn-hero:hover {
      filter: brightness(1.2);
    }

    .back-nav {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* CUSTOM UTILS */
    .text-green {
      color: var(--accent-primary);
    }

    .text-amber {
      color: var(--accent-warning);
    }

    .text-red {
      color: var(--accent-danger);
    }

    .mini-card,
    .pay-card,
    .action-hero,
    .detail-grid > * {
      content-visibility: auto;
      contain-intrinsic-size: 220px;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .payments-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .main-viewport {
        grid-template-columns: 1fr;
        min-height: 100vh;
        min-height: 100dvh;
        height: auto;
        overflow: visible;
      }

      .master-panel {
        min-height: auto;
      }

      .master-header {
        padding: 14px;
      }

      .tab-bar {
        padding: 8px 10px;
        gap: 6px;
      }

      .tab-btn {
        font-size: 0.78rem;
        padding: 8px 10px;
      }

      .scroll-list {
        padding: 10px;
        overflow: visible;
        flex: 0 0 auto;
      }

      .detail-panel {
        display: flex;
        position: relative;
        inset: auto;
        background: transparent;
        z-index: 1;
        min-height: auto;
      }

      .detail-panel.visible {
        display: flex;
      }

      .detail-content {
        padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
        overflow: visible;
      }

      .detail-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .detail-close-btn {
        display: none;
        position: sticky;
        top: 12px;
        right: auto;
        margin: 12px 16px 0 auto;
        z-index: 2;
      }

      .detail-panel.visible .detail-close-btn {
        display: inline-flex;
      }
    }

    @media (max-width: 900px), (hover: none), (pointer: coarse) {
      .mini-card:hover {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tab-btn,
      .mini-card,
      .pay-filter-btn,
      .btn-hero {
        transition: none !important;
      }
    }

    @media (max-width: 520px) {
      .master-header h1 {
        font-size: 1rem;
      }

      .mini-card h3 {
        width: 100%;
        padding-right: 56px;
        white-space: normal;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
    }
  </style>
  <link rel="stylesheet" href="assets/css/panel-contrast.css?v=20260228g" />
</head>

<body>
  <div class="main-viewport">
    <!-- MASTER -->
    <section class="master-panel">
      <header class="master-header">
        <div class="master-header-row">
          <h1>Requests</h1>
          <button type="button" class="tab-btn" data-client-ui-action="go-back" title="Volver al Panel" style="padding:4px 8px; font-size:1rem;">Inicio</button>
        </div>
      </header>

      <nav class="tab-bar">
        <button type="button" class="tab-btn active" data-filter="available" data-client-ui-action="set-filter">Disponibles</button>
        <button type="button" class="tab-btn" data-filter="mine" data-client-ui-action="set-filter">Mis Casos</button>
        <button type="button" class="tab-btn" data-filter="done" data-client-ui-action="set-filter">Finalizadas</button>
        <button type="button" class="tab-btn" data-filter="payments" data-client-ui-action="set-filter">Mis Pagos</button>
      </nav>

      <div class="scroll-list" id="list">
        <!-- Cards will be injected here -->
      </div>
    </section>

    <!-- DETAIL -->
    <section class="detail-panel" id="detailPanel">
      <!-- Detail Close Button -->
      <button type="button" class="detail-close-btn" data-client-ui-action="close-detail" aria-label="Cerrar detalle">&times;</button>

      <div id="detailEmpty" class="empty-state-detail">
        <div style="font-size:3rem;">⚡</div>
        <p>Selecciona una solicitud para ver detalles<br>y tomar acciones rápidas.</p>
      </div>

      <div id="detailView" class="detail-content" style="display:none;">
        <!-- Detailed content injected here -->
      </div>
    </section>
  </div>

  <!-- Chat Panel Overlay (Floating) -->
  <div id="chatPanel" class="chat-panel hidden">
    <!-- Existing chat structure but restyled in JS/CSS -->
  </div>

  <script type="module" src="assets/js/client-requests.js?v=20260310b"></script>
  <script type="module" src="assets/js/company-branding.js?v=20260228e"></script>
</body>

</html>
